<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northstar Homes — AI Sales Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    header {
      width: 100%;
      max-width: 680px;
      padding: 1rem 0 0.5rem;
      text-align: center;
    }
    header h1 { font-size: 1.25rem; color: #1a1a2e; }
    header p  { font-size: 0.85rem; color: #666; margin-top: 0.2rem; }

    #chat-container {
      width: 100%;
      max-width: 680px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      height: 70vh;
      margin-top: 1rem;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .msg {
      max-width: 80%;
      padding: 0.7rem 1rem;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #1a1a2e;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.agent {
      align-self: flex-start;
      background: #f0f0f0;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }
    .msg.system-note {
      align-self: center;
      background: #fff3cd;
      color: #856404;
      font-size: 0.8rem;
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
    }

    #input-area {
      display: flex;
      padding: 0.75rem;
      border-top: 1px solid #eee;
      gap: 0.5rem;
      background: #fff;
    }
    #user-input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      font-family: inherit;
      max-height: 100px;
    }
    #user-input:focus { border-color: #1a1a2e; }

    #send-btn {
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 1.2rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #send-btn:hover:not(:disabled) { background: #2d2d5a; }
    #send-btn:disabled { background: #aaa; cursor: not-allowed; }

    #status-bar {
      width: 100%;
      max-width: 680px;
      font-size: 0.75rem;
      color: #999;
      text-align: right;
      padding: 0.3rem 0;
    }

    .typing {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 0.7rem 1rem;
    }
    .typing span {
      width: 7px; height: 7px;
      background: #999;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%            { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

<header>
  <h1>Northstar Homes</h1>
  <p>Chat with Riya, our AI sales assistant</p>
</header>

<div id="chat-container">
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="Type your message..."></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<div id="status-bar" id="status-bar">Starting session&hellip;</div>

<script>
  const messagesEl  = document.getElementById("messages");
  const inputEl     = document.getElementById("user-input");
  const sendBtn     = document.getElementById("send-btn");
  const statusBar   = document.getElementById("status-bar");

  let sessionId = null;
  let sessionEnded = false;

  // ---- session start -------------------------------------------------------
  async function startSession() {
    try {
      const res = await fetch("/session/start", { method: "POST" });
      const data = await res.json();
      sessionId = data.session_id;
      statusBar.textContent = `Session: ${sessionId.slice(0, 8)}…`;

      // Kick off the opening message from the agent.
      await sendMessage("Namaste! I am interested in Northstar One.");
    } catch (e) {
      appendSystemNote("Could not connect to server. Is the backend running?");
    }
  }

  // ---- message helpers -----------------------------------------------------
  function appendMsg(role, text) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function appendSystemNote(text) {
    const div = document.createElement("div");
    div.className = "msg system-note";
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "msg agent typing";
    div.id = "typing-indicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  // ---- core send -----------------------------------------------------------
  async function sendMessage(text) {
    if (!text.trim() || !sessionId || sessionEnded) return;

    appendMsg("user", text);
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    const typing = showTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      removeTyping();

      if (!res.ok) {
        const err = await res.json();
        appendSystemNote(`Error: ${err.detail || res.statusText}`);
        return;
      }

      const data = await res.json();
      appendMsg("agent", data.response);

      if (data.ended) {
        sessionEnded = true;
        sendBtn.disabled = true;
        inputEl.disabled = true;
        appendSystemNote("This session has ended.");
        statusBar.textContent = "Session ended.";
      }
    } catch (e) {
      removeTyping();
      appendSystemNote("Network error. Please check your connection.");
    } finally {
      if (!sessionEnded) sendBtn.disabled = false;
    }
  }

  // ---- event wiring --------------------------------------------------------
  sendBtn.addEventListener("click", () => sendMessage(inputEl.value));

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(inputEl.value);
    }
  });

  // Auto-resize textarea
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = `${Math.min(inputEl.scrollHeight, 100)}px`;
  });

  // ---- init ----------------------------------------------------------------
  startSession();
</script>
</body>
</html>
