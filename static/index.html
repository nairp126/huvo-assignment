<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northstar Homes — AI Sales Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem 1rem;
      color: #1a1a2e;
    }

    header {
      width: 100%;
      max-width: 720px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.75rem;
    }
    .header-titles h1 { font-size: 1.35rem; font-weight: 700; color: #1a1a2e; }
    .header-titles p  { font-size: 0.85rem; color: #555; margin-top: 0.15rem; }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-secondary {
      background: #fff;
      border: 1px solid #d0d5dd;
      color: #344054;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-secondary:hover {
      background: #f9fafb;
      border-color: #98a2b3;
    }

    .btn-analytics {
      background: #0f172a;
      border: 1px solid #0f172a;
      color: #fff;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-analytics:hover {
      background: #1e293b;
    }

    #chat-container {
      width: 100%;
      max-width: 720px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      height: 72vh;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .msg {
      max-width: 82%;
      padding: 0.75rem 1.05rem;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #0f172a;
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .msg.agent {
      align-self: flex-start;
      background: #f1f5f9;
      color: #0f172a;
      border-bottom-left-radius: 3px;
    }
    .msg.system-note {
      align-self: center;
      background: #fef3c7;
      color: #92400e;
      font-size: 0.8rem;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
    }

    #input-area {
      display: flex;
      padding: 0.85rem 1rem;
      border-top: 1px solid #e5e7eb;
      gap: 0.6rem;
      background: #fff;
      align-items: flex-end;
    }
    #user-input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 0.65rem 0.95rem;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      font-family: inherit;
      max-height: 110px;
      line-height: 1.4;
    }
    #user-input:focus { border-color: #0f172a; }

    #send-btn {
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.3rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #send-btn:hover:not(:disabled) { background: #1e293b; }
    #send-btn:disabled { background: #94a3b8; cursor: not-allowed; }

    #status-bar {
      width: 100%;
      max-width: 720px;
      font-size: 0.78rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.25rem 0;
    }

    .typing {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 0.75rem 1.05rem;
    }
    .typing span {
      width: 6px; height: 6px;
      background: #64748b;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%            { transform: translateY(-5px); }
    }

    /* Analytics Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .modal-backdrop.active { display: flex; }

    .modal-content {
      background: #fff;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }
    .modal-header h2 { font-size: 1.15rem; font-weight: 700; color: #0f172a; }
    .modal-close {
      background: none; border: none; font-size: 1.25rem; color: #64748b; cursor: pointer;
    }

    .analytics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      margin-bottom: 1rem;
    }
    .analytics-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.75rem;
    }
    .analytics-card .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.5px;
    }
    .analytics-card .value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
      margin-top: 0.2rem;
    }

    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-hot  { background: #fee2e2; color: #991b1b; }
    .badge-warm { background: #fef3c7; color: #92400e; }
    .badge-cold { background: #e0f2fe; color: #075985; }

    .summary-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.85rem;
      margin-top: 0.5rem;
    }
    .summary-box .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 0.35rem;
    }
    .summary-box p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #334155;
    }
  </style>
</head>
<body>

<header>
  <div class="header-titles">
    <h1>Northstar Homes</h1>
    <p>AI Sales Assistant &middot; Northstar One, Sector 79 Gurugram</p>
  </div>
  <div class="header-actions">
    <button id="new-chat-btn" class="btn-secondary">New Session</button>
    <button id="analytics-btn" class="btn-analytics">Live Analytics</button>
  </div>
</header>

<div id="chat-container">
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="Type in English, Hindi, or Hinglish..."></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<div id="status-bar">
  <span id="session-info">Initializing session&hellip;</span>
  <span id="channel-badge">Voice-Ready Protocol &bull; Dual-Channel</span>
</div>

<!-- Analytics Modal -->
<div id="analytics-modal" class="modal-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Session Analytics</h2>
      <button id="close-modal-btn" class="modal-close">&times;</button>
    </div>
    <div id="analytics-body">
      <p style="color:#64748b; font-size:0.9rem;">Fetching analytics from ground truth...</p>
    </div>
  </div>
</div>

<script>
  const messagesEl  = document.getElementById("messages");
  const inputEl     = document.getElementById("user-input");
  const sendBtn     = document.getElementById("send-btn");
  const sessionInfo = document.getElementById("session-info");
  const newChatBtn  = document.getElementById("new-chat-btn");
  const analyticsBtn= document.getElementById("analytics-btn");
  const modal       = document.getElementById("analytics-modal");
  const closeModal  = document.getElementById("close-modal-btn");
  const analyticsBody = document.getElementById("analytics-body");

  let sessionId = null;
  let sessionEnded = false;

  async function startSession() {
    messagesEl.innerHTML = "";
    sessionEnded = false;
    sendBtn.disabled = false;
    inputEl.disabled = false;
    sessionInfo.textContent = "Starting new session...";

    try {
      const res = await fetch("/session/start", { method: "POST" });
      const data = await res.json();
      sessionId = data.session_id;
      sessionInfo.textContent = `Session: ${sessionId.slice(0, 8)}…`;

      // Welcome prompt
      appendMsg("agent", "Namaste! I am Riya from Northstar Homes. Are you looking for a 2 BHK or 3 BHK home at Northstar One in Sector 79, Gurugram?");
    } catch (e) {
      appendSystemNote("Could not connect to server. Is the FastAPI backend running?");
    }
  }

  function appendMsg(role, text) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function appendSystemNote(text) {
    const div = document.createElement("div");
    div.className = "msg system-note";
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "msg agent typing";
    div.id = "typing-indicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  async function sendMessage(text) {
    if (!text.trim() || !sessionId || sessionEnded) return;

    appendMsg("user", text);
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    showTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      removeTyping();

      if (!res.ok) {
        const err = await res.json();
        appendSystemNote(`Error: ${err.detail || res.statusText}`);
        return;
      }

      const data = await res.json();
      appendMsg("agent", data.response);

      if (data.ended) {
        sessionEnded = true;
        sendBtn.disabled = true;
        inputEl.disabled = true;
        appendSystemNote("Conversation concluded.");
        sessionInfo.textContent = "Session ended.";
      }
    } catch (e) {
      removeTyping();
      appendSystemNote("Network error. Please check your connection.");
    } finally {
      if (!sessionEnded) sendBtn.disabled = false;
    }
  }

  async function showAnalytics() {
    if (!sessionId) return;
    modal.classList.add("active");
    analyticsBody.innerHTML = '<p style="color:#64748b; font-size:0.9rem;">Deriving analytics from tool-call log & model...</p>';

    try {
      const res = await fetch(`/analytics/${sessionId}`);
      if (!res.ok) {
        analyticsBody.innerHTML = '<p style="color:#dc2626;">Failed to load analytics.</p>';
        return;
      }
      const data = await res.json();

      const interestBadge = data.interest_level === "hot" 
        ? '<span class="badge badge-hot">Hot</span>'
        : data.interest_level === "warm"
        ? '<span class="badge badge-warm">Warm</span>'
        : '<span class="badge badge-cold">Cold</span>';

      analyticsBody.innerHTML = `
        <div class="analytics-grid">
          <div class="analytics-card">
            <div class="label">Configuration</div>
            <div class="value">${data.configuration_interest || 'Undecided'}</div>
          </div>
          <div class="analytics-card">
            <div class="label">Budget</div>
            <div class="value">${data.budget_indicated || 'Not indicated'}</div>
          </div>
          <div class="analytics-card">
            <div class="label">Purpose</div>
            <div class="value">${data.purpose || 'Unknown'}</div>
          </div>
          <div class="analytics-card">
            <div class="label">Interest Level</div>
            <div class="value">${interestBadge}</div>
          </div>
          <div class="analytics-card">
            <div class="label">Site Visit Status</div>
            <div class="value">${data.site_visit_status} ${data.site_visit_datetime ? `(${data.site_visit_datetime})` : ''}</div>
          </div>
          <div class="analytics-card">
            <div class="label">DND / Escalation</div>
            <div class="value">${data.dnd_opt_out ? 'DND Opt-Out' : (data.escalated_to_human ? 'Escalated to Human' : 'Standard')}</div>
          </div>
        </div>
        <div class="summary-box">
          <div class="label">Executive Summary</div>
          <p>${data.summary || 'No summary available.'}</p>
        </div>
      `;
    } catch (e) {
      analyticsBody.innerHTML = '<p style="color:#dc2626;">Network error loading analytics.</p>';
    }
  }

  // Event wiring
  sendBtn.addEventListener("click", () => sendMessage(inputEl.value));
  newChatBtn.addEventListener("click", startSession);
  analyticsBtn.addEventListener("click", showAnalytics);
  closeModal.addEventListener("click", () => modal.classList.remove("active"));
  modal.addEventListener("click", (e) => {
    if (e.target === modal) modal.classList.remove("active");
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(inputEl.value);
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = `${Math.min(inputEl.scrollHeight, 110)}px`;
  });

  startSession();
</script>
</body>
</html>
